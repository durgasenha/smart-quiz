
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Smart Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("images/smartquiz.png");

background-size:cover;
background-position:center;
}

.register-box{

width:420px;
padding:40px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border-radius:20px;

text-align:center;

color:#fff;

box-shadow:0 10px 30px rgba(0,0,0,.4);

}

.register-box img{

width:90px;
margin-bottom:15px;

}

.register-box h1{

margin-bottom:10px;

}

.register-box p{

margin-bottom:25px;
color:#eee;

}

.input-box{

margin-bottom:20px;

}

.input-box input{

width:100%;
padding:14px;

border:none;
outline:none;

border-radius:30px;

font-size:16px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:30px;

background:#fff;

color:#111;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#111;

color:#fff;

border:2px solid #fff;

}

.login-link{

margin-top:20px;

}

.login-link a{

color:#fff;
text-decoration:none;

}

.login-link a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="register-box">

<img src="images/logo.png">

<h1>Smart Quiz</h1>

<p>Create Your Account</p>

<form id="registerForm">

    <div class="input-box">
        <input
            type="text"
            id="name"
            placeholder="Enter Name"
            required>
    </div>

    <div class="input-box">
        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required>
    </div>

    <div class="input-box">
        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required>
    </div>

    <button type="submit">
        Register
    </button>

</form>

<script src="js/register.js">

</script>

</body>
</html>
