<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Quiz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background-image: url(smartquiz.png")
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* Background overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            z-index: 0;
        }

        .register-container {
            width: 400px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 20px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);

            position: relative;
            z-index: 1;
        }

        .register-container h2 {
            text-align: center;

            margin-bottom: 25px;

            color: #222;

            font-size: 28px;
        }

        .register-container input {
            width: 100%;

            padding: 14px 15px;

            margin-bottom: 16px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }

        .register-container input:focus {
            border-color: #6d28d9;

            box-shadow: 0 0 5px rgba(109, 40, 217, 0.2);
        }

        .register-container button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #6d28d9,
                #9333ea
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-container button:hover {
            transform: translateY(-2px);

            box-shadow: 0 5px 15px rgba(109, 40, 217, 0.3);
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #555;

            font-size: 14px;
        }

        .login-link a {
            color: #6d28d9;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .register-container {
                width: 90%;

                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h2>Create Account</h2>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script src="register.js"></script>

</body>
</html>
