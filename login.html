<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Smart Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

    background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url("images/smartquiz.png");

    background-size:cover;
    background-position:center;
}

.login-box{

    width:400px;
    padding:40px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    border-radius:20px;

    text-align:center;

    color:#fff;

    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.login-box img{

    width:90px;
    margin-bottom:15px;
}

.login-box h1{

    margin-bottom:10px;
}

.login-box p{

    color:#eee;
    margin-bottom:25px;
}

.input-box{

    margin-bottom:20px;
}

.input-box input{

    width:100%;
    padding:14px;

    border:none;

    outline:none;

    border-radius:30px;

    font-size:16px;
}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:30px;

    background:#ffffff;

    color:#111;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    background:#111;

    color:#fff;

    border:2px solid #fff;
}

.back{

    margin-top:20px;
}

.back a{

    color:#fff;

    text-decoration:none;
}

.back a:hover{

    text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-box">

    <img src="images/logo.png" alt="Logo">

    <h1>Smart Quiz</h1>

    <p>Login to Start Your Quiz</p>

    <form id="loginForm">

        <div class="input-box">
            <input type="email" id="email" placeholder="Enter Email" required>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="Enter Password" required>
        </div>

        <button type="submit">Login</button>

    </form>

</div>

<script src="js/login.js"></script>

</body>
