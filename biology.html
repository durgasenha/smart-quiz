<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology Quiz - Smart Quiz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f4f4f4;
}

.quiz-box{
    width:700px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#16a34a;
    margin-bottom:20px;
}

#question{
    margin-bottom:20px;
    line-height:1.6;
}

.option{
    display:block;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    cursor:pointer;
}

.option:hover{
    background:#dcfce7;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:#fff;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#15803d;
}
</style>

</head>

<body>
<div class="timer-box">
    ⏱ Time Left :
    <span id="timer">60:00</span>
</div>
<div class="quiz-box">

<h1>🧬 Biology Quiz</h1>

<h2 id="question">Loading...</h2>

<div id="options"></div>

<div class="buttons">
    <button onclick="previousQuestion()">Previous</button>
    <button onclick="nextQuestion()">Next</button>
    <button onclick="submitQuiz()">Submit</button>
</div>

</div>
<script src="js/common.js"></script>
<script src="js/biology.js"></script>
<script src="js/timer.js"></script>


</body>
</html>
