<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tamil Quiz - Smart Quiz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#f5f3ff,#ede9fe);
    min-height:100vh;
    padding:40px 20px;
}

/* TIMER */

.timer-box{
    width:700px;
    max-width:100%;
    margin:0 auto 20px;
    background:#111;
    color:#fff;
    padding:15px 20px;
    border-radius:10px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

#timer{
    color:#00c6ff;
}

/* QUIZ BOX */

.quiz-box{
    width:700px;
    max-width:100%;
    margin:0 auto;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#6d28d9;
    margin-bottom:25px;
}

#question{
    margin-bottom:25px;
    line-height:1.7;
    color:#222;
}

/* OPTIONS */

.option{
    display:block;
    width:100%;
    padding:14px;
    margin:12px 0;
    border:1px solid #ddd;
    border-radius:8px;
    cursor:pointer;
    background:#fff;
    transition:.3s;
}

.option:hover{
    background:#f0e9ff;
    border-color:#6d28d9;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:25px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#6d28d9;
    color:#fff;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#5b21b6;
}

@media(max-width:600px){

    .quiz-box{
        padding:20px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}

</style>

</head>

<body>

<!-- TIMER -->

<div class="timer-box">
    ⏱ Time Left :
    <span id="timer">60:00</span>
</div>


<!-- QUIZ -->

<div class="quiz-box">

    <h1>📖 Tamil Quiz</h1>

    <h2 id="question">Loading...</h2>

    <div id="options"></div>

    <div class="buttons">

        <button onclick="previousQuestion()">
            Previous
        </button>

        <button onclick="nextQuestion()">
            Next
        </button>

        <button onclick="submitQuiz()">
            Submit
        </button>

    </div>

</div>


<!-- JAVASCRIPT -->

<script src="tamil.js"></script>
<script src="timer.js"></script>

</body>

</html>
